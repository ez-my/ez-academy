[build]
  command = "npm run build:netlify"
  publish = "dist-web"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Security headers applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Block clickjacking — only allow framing from same origin
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

# API responses should not be cached or framed
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

# Vite writes a content hash into every filename under /assets, so these files are
# immutable: a change produces a new name. Without this they were served
# "max-age=0, must-revalidate", making every repeat visit revalidate each one.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images are not content-hashed, so they get a shorter window than /assets.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/api/listening/audio/*"
  to = "/.netlify/functions/listening-audio/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


[functions."ops-scheduler"]
  schedule = "0 */8 * * *"

# Daily practice reminders — 08:00 MYT (UTC 00:00)
# Prerequisite: FCM must be set up (see TEKNO skill: EZ Academy Push Notification Setup)
# Uncomment once VITE_FIREBASE_VAPID_KEY and Firebase Admin FCM credentials are configured
